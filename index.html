<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <title>JetBlack Docs</title>
    <meta name="description" content="Reference guide for Pokémon JetBlack — Pokédex, wild encounters, trainers, items and more." />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body>
    <script>
      // Decodes the ?p=/real/path redirect from 404.html (see that file for why)
      // back into a normal history entry before the app boots and reads the URL.
      (function (l) {
        if (l.search[1] === "p" && l.search[2] === "=") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded[0].slice(2) + (decoded[1] ? "?" + decoded[1].slice(2) : "") + l.hash);
        }
      })(window.location);
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
